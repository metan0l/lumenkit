packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  # необязательный нативный ускоритель BullMQ — работает и без него
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@remotion/media@4.0.535'
  - '@remotion/player@4.0.535'
  - remotion@4.0.535
  - zod@4.6.6
