<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-cyrillic-wght-normal.woff2") format("woff2");
          font-weight: 100 900;
          unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-latin-wght-normal.woff2") format("woff2");
          font-weight: 100 900;
        }
        #root {
          position: absolute;
          inset: 0;
          font-family: "Inter", sans-serif;
        }
        #cap-band {
          position: absolute;
          left: 80px;
          right: 80px;
          top: 1520px;
          height: 160px;
        }
        .cap-group {
          position: absolute;
          inset: 0;
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          justify-content: center;
          gap: 0 18px;
          opacity: 0;
        }
        .cap-word {
          display: inline-block;
          font-size: 58px;
          font-weight: 700;
          letter-spacing: -0.01em;
          line-height: 1.2;
          color: rgba(255, 255, 255, 0.42);
        }
      </style>

      <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">
        <div id="cap-band"></div>
      </div>

      <script>
        // Группы слов из расшифровки (секунды озвучки), исправленные вручную
        const GROUPS = [[{"t": "Привет!", "s": 0.18, "e": 0.9}], [{"t": "Ты", "s": 1.2, "e": 1.3}, {"t": "знал,", "s": 1.3, "e": 1.64}], [{"t": "что", "s": 1.64, "e": 1.76}, {"t": "Claude", "s": 1.76, "e": 2.06}, {"t": "может", "s": 2.06, "e": 2.42}], [{"t": "монтировать", "s": 2.42, "e": 3.1}, {"t": "в", "s": 3.1, "e": 3.18}, {"t": "данный", "s": 3.18, "e": 3.42}], [{"t": "момент", "s": 3.42, "e": 3.68}, {"t": "абсолютно", "s": 3.68, "e": 4.06}, {"t": "сам", "s": 4.06, "e": 4.5}], [{"t": "и", "s": 4.5, "e": 4.74}, {"t": "абсолютно", "s": 4.74, "e": 5.16}, {"t": "бесплатно,", "s": 5.16, "e": 6.0}], [{"t": "почему", "s": 6.26, "e": 6.72}, {"t": "выбирают", "s": 6.72, "e": 7.78}, {"t": "Claude?", "s": 7.78, "e": 8.06}], [{"t": "Да", "s": 8.34, "e": 8.38}, {"t": "потому", "s": 8.38, "e": 8.68}, {"t": "что", "s": 8.68, "e": 8.94}], [{"t": "людям", "s": 8.94, "e": 9.26}, {"t": "интересно", "s": 9.26, "e": 9.72}, {"t": "смотреть", "s": 9.72, "e": 10.3}], [{"t": "за", "s": 10.3, "e": 10.84}, {"t": "этой", "s": 10.84, "e": 11.0}, {"t": "интересной", "s": 11.0, "e": 11.46}], [{"t": "инфографикой.", "s": 11.46, "e": 12.36}], [{"t": "Например,", "s": 12.5, "e": 12.82}], [{"t": "посмотри", "s": 13.12, "e": 13.36}, {"t": "как", "s": 13.36, "e": 13.54}, {"t": "шарик", "s": 13.54, "e": 13.92}], [{"t": "бежит", "s": 13.92, "e": 14.64}, {"t": "влево", "s": 14.64, "e": 15.12}, {"t": "или", "s": 15.12, "e": 15.32}], [{"t": "шарик", "s": 15.32, "e": 15.68}, {"t": "бежит", "s": 15.68, "e": 15.92}, {"t": "вправо,", "s": 15.92, "e": 16.56}], [{"t": "здесь", "s": 16.74, "e": 16.94}, {"t": "появляются", "s": 16.94, "e": 17.54}, {"t": "необычные", "s": 17.54, "e": 18.2}], [{"t": "скользящие", "s": 18.2, "e": 18.78}, {"t": "эффекты", "s": 18.78, "e": 19.5}, {"t": "или", "s": 19.5, "e": 19.72}], [{"t": "даже", "s": 19.72, "e": 19.98}, {"t": "вот", "s": 19.98, "e": 20.12}, {"t": "такие", "s": 20.12, "e": 20.4}], [{"t": "красивые", "s": 20.4, "e": 20.92}, {"t": "стеклянные", "s": 20.92, "e": 21.44}, {"t": "плашечки.", "s": 21.44, "e": 22.04}], [{"t": "Всё", "s": 22.04, "e": 22.68}, {"t": "это —", "s": 22.68, "e": 22.86}, {"t": "моушн-графика.", "s": 22.86, "e": 23.8}]];
        const band = document.getElementById("cap-band");
        const tl = gsap.timeline({ paused: true });
        const ACTIVE = "#FF8A1F", SPOKEN = "#FFFFFF", UPCOMING = "rgba(255,255,255,0.42)";

        GROUPS.forEach((g, gi) => {
          const el = document.createElement("div");
          el.className = "cap-group";
          el.id = "cap-g" + gi;
          g.forEach((w, wi) => {
            const s = document.createElement("span");
            s.className = "cap-word";
            s.id = "cap-g" + gi + "-w" + wi;
            s.textContent = w.t;
            el.appendChild(s);
          });
          band.appendChild(el);

          // Фраза появляется чуть раньше первого слова и уходит строго до появления следующей
          const enter = (i) => Math.max(0, GROUPS[i][0].s - 0.12);
          const start = enter(gi);
          const next = GROUPS[gi + 1];
          const out = next ? enter(gi + 1) - 0.09 : 26.3;
          tl.fromTo(el, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.16, ease: "power2.out" }, start);
          tl.to(el, { opacity: 0, y: -16, duration: 0.08, ease: "power1.in" }, out);

          g.forEach((w, wi) => {
            const id = "#cap-g" + gi + "-w" + wi;
            tl.set(id, { color: UPCOMING }, 0);
            tl.set(id, { color: ACTIVE }, w.s);
            tl.fromTo(id, { scale: 1 }, { scale: 1.08, duration: 0.09, ease: "power2.out", yoyo: true, repeat: 1 }, w.s);
            tl.set(id, { color: SPOKEN }, w.e);
          });
        });

        window.__timelines["captions"] = tl;
      </script>
    </template>
  </body>
</html>
