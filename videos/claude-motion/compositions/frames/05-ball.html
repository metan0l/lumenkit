<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-cyrillic-wght-normal.woff2") format("woff2");
          font-weight: 100 900;
          unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-latin-wght-normal.woff2") format("woff2");
          font-weight: 100 900;
        }
        #root {
          position: absolute;
          inset: 0;
          font-family: "Inter", sans-serif;
          color: #fff;
        }
        #s05-chip {
          position: absolute;
          left: 0;
          right: 0;
          top: 380px;
          display: flex;
          justify-content: center;
        }
        #s05-chip-in {
          padding: 18px 34px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.08);
          border: 2px solid rgba(255, 255, 255, 0.1);
          font-size: 38px;
          font-weight: 600;
          color: rgba(255, 255, 255, 0.85);
        }
        #s05-value {
          position: absolute;
          left: 0;
          right: 0;
          top: 520px;
          text-align: center;
          font-size: 200px;
          font-weight: 800;
          letter-spacing: -0.05em;
          font-variant-numeric: tabular-nums;
        }
        #s05-track {
          position: absolute;
          left: 140px;
          top: 860px;
          width: 800px;
          height: 24px;
          border-radius: 12px;
          background: rgba(255, 255, 255, 0.12);
        }
        #s05-fill-l,
        #s05-fill-r {
          position: absolute;
          top: 0;
          height: 24px;
          width: 400px;
          border-radius: 12px;
          background: #0a84ff;
          box-shadow: 0 0 30px rgba(10, 132, 255, 0.55);
        }
        #s05-fill-l {
          right: 400px;
          transform-origin: 100% 50%;
        }
        #s05-fill-r {
          left: 400px;
          transform-origin: 0% 50%;
          background: #ff8a1f;
          box-shadow: 0 0 30px rgba(255, 138, 31, 0.55);
        }
        .s05-tick {
          position: absolute;
          top: 44px;
          width: 4px;
          height: 22px;
          border-radius: 2px;
          background: rgba(255, 255, 255, 0.2);
        }
        .s05-ghost,
        #s05-ball {
          position: absolute;
          left: 480px;
          top: 812px;
          width: 120px;
          height: 120px;
          border-radius: 50%;
        }
        .s05-ghost {
          background: rgba(255, 255, 255, 0.18);
          opacity: 0;
        }
        #s05-ball {
          background: radial-gradient(circle at 35% 30%, #ffffff, #e9e3df 55%, #b9b0aa 100%);
          box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
        }
        .s05-label {
          position: absolute;
          top: 1010px;
          display: flex;
          align-items: center;
          gap: 16px;
          font-size: 50px;
          font-weight: 700;
          color: rgba(255, 255, 255, 0.35);
        }
        #s05-left {
          left: 140px;
        }
        #s05-right {
          right: 140px;
        }
      </style>

      <div id="root" data-composition-id="s05" data-width="1080" data-height="1920">
        <div id="s05-chip"><div id="s05-chip-in">Например</div></div>
        <div id="s05-value">50</div>
        <div id="s05-track">
          <div id="s05-fill-l"></div>
          <div id="s05-fill-r"></div>
          <div class="s05-tick" style="left: 0"></div>
          <div class="s05-tick" style="left: 198px"></div>
          <div class="s05-tick" style="left: 398px"></div>
          <div class="s05-tick" style="left: 598px"></div>
          <div class="s05-tick" style="left: 796px"></div>
        </div>
        <div class="s05-ghost" id="s05-g1"></div>
        <div class="s05-ghost" id="s05-g2"></div>
        <div class="s05-ghost" id="s05-g3"></div>
        <div id="s05-ball"></div>
        <div class="s05-label" id="s05-left">
          <svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>
          Влево
        </div>
        <div class="s05-label" id="s05-right">
          Вправо
          <svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        const LEFT = -340, RIGHT = 340;
        const val = document.getElementById("s05-value");
        const pos = { x: 0 };
        const sync = () => {
          // Значение слайдера следует за шариком: 0…100
          val.textContent = String(Math.round(50 + (pos.x / RIGHT) * 50));
          gsap.set("#s05-ball", { x: pos.x });
          gsap.set("#s05-fill-l", { scaleX: Math.max(0, -pos.x) / 400 });
          gsap.set("#s05-fill-r", { scaleX: Math.max(0, pos.x) / 400 });
        };

        tl.fromTo("#s05-chip-in", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.8)" }, 0.04);
        tl.fromTo("#s05-track", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 0.4);
        tl.fromTo("#s05-value", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 0.65);
        tl.fromTo([".s05-label"], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", stagger: 0.08 }, 0.8);
        // «шарик» — появляется
        tl.fromTo("#s05-ball", { scale: 0 }, { scale: 1, duration: 0.42, ease: "back.out(2.4)" }, 1.06);
        tl.set(["#s05-fill-l", "#s05-fill-r"], { scaleX: 0 }, 0);

        // «влево»
        tl.fromTo(pos, { x: 0 }, { x: LEFT, duration: 0.55, ease: "power3.inOut", onUpdate: sync }, 2.1);
        tl.fromTo("#s05-ball", { scaleX: 1, scaleY: 1 }, { scaleX: 1.25, scaleY: 0.8, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 2.18);
        tl.fromTo("#s05-left", { color: "rgba(255,255,255,0.35)" }, { color: "#0a84ff", duration: 0.2 }, 2.2);
        ["#s05-g1", "#s05-g2", "#s05-g3"].forEach((id, i) => {
          tl.fromTo(id, { x: 0, opacity: 0.0 }, { x: LEFT + 60 * (i + 1), opacity: 0.5 - i * 0.12, duration: 0.5, ease: "power3.inOut" }, 2.12 + i * 0.03);
          tl.to(id, { opacity: 0, duration: 0.25 }, 2.72);
        });
        tl.to("#s05-left", { color: "rgba(255,255,255,0.35)", duration: 0.3 }, 3.2);

        // «вправо»
        tl.fromTo(pos, { x: LEFT }, { x: RIGHT, duration: 0.7, ease: "power3.inOut", onUpdate: sync, immediateRender: false }, 3.36);
        tl.fromTo("#s05-ball", { scaleX: 1, scaleY: 1 }, { scaleX: 1.3, scaleY: 0.78, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 3.46);
        tl.fromTo("#s05-right", { color: "rgba(255,255,255,0.35)" }, { color: "#ff8a1f", duration: 0.2 }, 3.5);
        ["#s05-g1", "#s05-g2", "#s05-g3"].forEach((id, i) => {
          tl.fromTo(id, { x: LEFT, opacity: 0.0 }, { x: RIGHT - 70 * (i + 1), opacity: 0.5 - i * 0.12, duration: 0.65, ease: "power3.inOut", immediateRender: false }, 3.38 + i * 0.03);
          tl.to(id, { opacity: 0, duration: 0.25 }, 4.12);
        });
        tl.fromTo("#s05-value", { scale: 1 }, { scale: 1.12, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 4.0);

        window.__timelines["s05"] = tl;
      </script>
    </template>
  </body>
</html>
