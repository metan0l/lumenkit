<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-cyrillic-wght-normal.woff2") format("woff2");
          font-weight: 100 900;
          unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-latin-wght-normal.woff2") format("woff2");
          font-weight: 100 900;
        }
        #root {
          position: absolute;
          inset: 0;
          font-family: "Inter", sans-serif;
          color: #fff;
        }
        #s01-stage {
          position: absolute;
          inset: 0 0 540px 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 90px;
        }
        #s01-title {
          font-size: 150px;
          font-weight: 800;
          letter-spacing: -0.04em;
          line-height: 1;
        }
        #s01-toggle {
          position: relative;
          width: 300px;
          height: 170px;
          border-radius: 85px;
          background: #3a3634;
          box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        #s01-toggle-on {
          position: absolute;
          inset: 0;
          border-radius: 85px;
          background: #0a84ff;
          box-shadow: 0 0 80px rgba(10, 132, 255, 0.45);
        }
        #s01-knob {
          position: absolute;
          left: 12px;
          top: 12px;
          width: 146px;
          height: 146px;
          border-radius: 50%;
          background: #fff;
          box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
        }
        #s01-cursor {
          position: absolute;
          left: 455px;
          top: 800px;
          width: 96px;
          height: 96px;
        }
        #s01-ripple {
          position: absolute;
          left: 415px;
          top: 750px;
          width: 120px;
          height: 120px;
          border-radius: 50%;
          border: 4px solid rgba(255, 255, 255, 0.7);
        }
      </style>

      <div id="root" data-composition-id="s01" data-width="1080" data-height="1920">
        <div id="s01-stage">
          <div id="s01-title">Привет!</div>
          <div id="s01-toggle">
            <div id="s01-toggle-on"></div>
            <div id="s01-knob"></div>
          </div>
        </div>
        <div id="s01-ripple"></div>
        <svg id="s01-cursor" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 2.5l14 9.2-6.3 1.3 3.6 6.6-2.7 1.4-3.6-6.6L5 19z" fill="#fff" stroke="#111" stroke-width="1.1" stroke-linejoin="round" />
        </svg>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        // Заголовок пружиной на «Привет»
        tl.fromTo("#s01-title", { y: 80, scale: 0.7, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.8)" }, 0.12);
        // Тумблер появляется
        tl.fromTo("#s01-toggle", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 0);
        tl.fromTo("#s01-toggle-on", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
        // Курсор подлетает и нажимает
        tl.fromTo("#s01-cursor", { x: 220, y: 260, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.38, ease: "power3.out" }, 0.02);
        tl.to("#s01-cursor", { scale: 0.82, duration: 0.08, ease: "power2.in" }, 0.4);
        tl.to("#s01-cursor", { scale: 1, duration: 0.14, ease: "power2.out" }, 0.49);
        tl.fromTo("#s01-ripple", { scale: 0.3, opacity: 0.9 }, { scale: 1.6, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.44);
        // Переключение
        tl.to("#s01-knob", { x: 130, duration: 0.32, ease: "back.out(1.4)" }, 0.46);
        tl.to("#s01-toggle-on", { opacity: 1, duration: 0.22, ease: "power1.out" }, 0.46);
        // Курсор уходит
        tl.to("#s01-cursor", { x: 120, y: 160, opacity: 0, duration: 0.35, ease: "power2.in" }, 0.82);
        window.__timelines["s01"] = tl;
      </script>
    </template>
  </body>
</html>
