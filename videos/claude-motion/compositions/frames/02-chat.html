<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-cyrillic-wght-normal.woff2") format("woff2");
          font-weight: 100 900;
          unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-latin-wght-normal.woff2") format("woff2");
          font-weight: 100 900;
        }
        #root {
          position: absolute;
          inset: 0;
          font-family: "Inter", sans-serif;
          color: #fff;
        }
        #s02-card {
          position: absolute;
          left: 90px;
          top: 250px;
          width: 900px;
          height: 840px;
          border-radius: 48px;
          background: rgba(28, 24, 22, 0.92);
          border: 2px solid rgba(255, 255, 255, 0.07);
          box-shadow: 0 50px 120px rgba(0, 0, 0, 0.55);
          overflow: hidden;
        }
        #s02-head {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 130px;
          display: flex;
          align-items: center;
          gap: 24px;
          padding: 0 44px;
          border-bottom: 2px solid rgba(255, 255, 255, 0.06);
        }
        #s02-avatar {
          width: 72px;
          height: 72px;
          border-radius: 50%;
          background: #d97a43;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #s02-name {
          font-size: 38px;
          font-weight: 700;
        }
        #s02-status {
          font-size: 26px;
          font-weight: 500;
          color: #30d158;
        }
        #s02-user {
          position: absolute;
          right: 44px;
          top: 180px;
          padding: 26px 34px;
          border-radius: 36px 36px 10px 36px;
          background: #0a84ff;
          font-size: 40px;
          font-weight: 600;
          white-space: nowrap;
        }
        .s02-ch {
          opacity: 0;
        }
        #s02-typing {
          position: absolute;
          left: 44px;
          top: 330px;
          display: flex;
          gap: 12px;
          padding: 26px 30px;
          border-radius: 30px;
          background: #2e2826;
        }
        .s02-dot {
          display: block;
          width: 16px;
          height: 16px;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.6);
        }
        #s02-reply {
          position: absolute;
          left: 44px;
          right: 44px;
          top: 330px;
          padding: 34px;
          border-radius: 36px 36px 36px 10px;
          background: #2a2422;
        }
        #s02-reply-text {
          font-size: 36px;
          font-weight: 600;
          margin-bottom: 26px;
        }
        #s02-tl {
          position: relative;
          height: 230px;
          border-radius: 22px;
          background: #161210;
          overflow: hidden;
        }
        .s02-track {
          position: absolute;
          left: 20px;
          right: 20px;
          height: 52px;
        }
        .s02-clip {
          position: absolute;
          top: 0;
          height: 52px;
          border-radius: 12px;
        }
        #s02-playhead {
          position: absolute;
          top: 10px;
          bottom: 10px;
          left: 20px;
          width: 6px;
          border-radius: 3px;
          background: #ff8a1f;
          box-shadow: 0 0 20px rgba(255, 138, 31, 0.8);
        }
        #s02-chips {
          position: absolute;
          left: 44px;
          right: 44px;
          top: 700px;
          display: flex;
          gap: 26px;
          align-items: center;
        }
        #s02-self {
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 24px 34px;
          border-radius: 999px;
          background: rgba(48, 209, 88, 0.16);
          color: #30d158;
          font-size: 44px;
          font-weight: 700;
        }
        #s02-price {
          position: relative;
          display: flex;
          align-items: baseline;
          gap: 22px;
          padding: 20px 34px;
          border-radius: 999px;
          background: rgba(255, 138, 31, 0.14);
        }
        #s02-old {
          position: relative;
          font-size: 40px;
          font-weight: 600;
          color: rgba(255, 255, 255, 0.5);
        }
        #s02-strike {
          position: absolute;
          left: -6px;
          right: -6px;
          top: 50%;
          height: 5px;
          border-radius: 3px;
          background: #ff375f;
          transform-origin: left center;
        }
        #s02-free {
          font-size: 64px;
          font-weight: 800;
          color: #ff8a1f;
        }
      </style>

      <div id="root" data-composition-id="s02" data-width="1080" data-height="1920">
        <div id="s02-card">
          <div id="s02-head">
            <div id="s02-avatar">
              <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true">
                <g fill="#fff">
                  <rect x="11" y="1" width="2" height="22" rx="1" />
                  <rect x="11" y="1" width="2" height="22" rx="1" transform="rotate(45 12 12)" />
                  <rect x="11" y="1" width="2" height="22" rx="1" transform="rotate(90 12 12)" />
                  <rect x="11" y="1" width="2" height="22" rx="1" transform="rotate(135 12 12)" />
                </g>
              </svg>
            </div>
            <div>
              <div id="s02-name">Claude</div>
              <div id="s02-status">● онлайн</div>
            </div>
          </div>

          <div id="s02-user"></div>

          <div id="s02-typing"><span class="s02-dot"></span><span class="s02-dot"></span><span class="s02-dot"></span></div>

          <div id="s02-reply">
            <div id="s02-reply-text">Готово! Собрал монтаж сам:</div>
            <div id="s02-tl">
              <div class="s02-track" style="top: 22px">
                <div id="s02-c1" class="s02-clip" style="left: 0; width: 300px; background: #8e5cff"></div>
                <div id="s02-c2" class="s02-clip" style="left: 312px; width: 236px; background: #8e5cff"></div>
                <div id="s02-c3" class="s02-clip" style="left: 560px; width: 180px; background: #8e5cff"></div>
              </div>
              <div class="s02-track" style="top: 89px">
                <div id="s02-c4" class="s02-clip" style="left: 60px; width: 210px; background: #ff8a1f"></div>
                <div id="s02-c5" class="s02-clip" style="left: 420px; width: 260px; background: #ff8a1f"></div>
              </div>
              <div class="s02-track" style="top: 156px">
                <div id="s02-c6" class="s02-clip" style="left: 0; width: 740px; background: #30d158; opacity: 0.75"></div>
              </div>
              <div id="s02-playhead"></div>
            </div>
          </div>

          <div id="s02-chips">
            <div id="s02-self">
              <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#30d158" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
              Сам
            </div>
            <div id="s02-price">
              <div id="s02-old">$29/мес<div id="s02-strike"></div></div>
              <div id="s02-free">0 ₽</div>
            </div>
          </div>
        </div>
      </div>

      <script>
        // Сообщение пользователя печатается по буквам
        const user = document.getElementById("s02-user");
        const text = "Смонтируй мне ролик";
        [...text].forEach((c, i) => {
          const s = document.createElement("span");
          s.className = "s02-ch";
          s.id = "s02-ch" + i;
          s.textContent = c === " " ? " " : c;
          user.appendChild(s);
        });

        const tl = gsap.timeline({ paused: true });
        // Окно
        tl.fromTo("#s02-card", { y: 120, scale: 0.92, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, 0);
        tl.fromTo("#s02-user", { scale: 0.6, opacity: 0, transformOrigin: "100% 100%" }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 0.08);
        [...text].forEach((c, i) => tl.set("#s02-ch" + i, { opacity: 1 }, 0.14 + i * 0.038));

        // Claude печатает…
        tl.fromTo("#s02-typing", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(1.6)" }, 0.88);
        tl.fromTo(".s02-dot", { y: 0 }, { y: -12, duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.07 }, 0.92);
        tl.to("#s02-typing", { opacity: 0, duration: 0.12 }, 1.18);

        // Ответ с таймлайном — на «монтировать»
        tl.fromTo("#s02-reply", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, 1.18);
        ["#s02-c1", "#s02-c2", "#s02-c3", "#s02-c4", "#s02-c5", "#s02-c6"].forEach((id, i) => {
          tl.fromTo(id, { x: 460, opacity: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: "back.out(1.3)" }, 1.3 + i * 0.11);
        });
        tl.fromTo("#s02-playhead", { x: 0 }, { x: 734, duration: 3.4, ease: "none" }, 1.5);

        // «сам»
        tl.fromTo("#s02-self", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(2)" }, 2.84);
        // «абсолютно бесплатно»
        tl.fromTo("#s02-price", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.38, ease: "back.out(1.8)" }, 3.5);
        tl.fromTo("#s02-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out" }, 3.82);
        tl.fromTo("#s02-free", { scale: 0.3, opacity: 0, rotate: -12 }, { scale: 1, opacity: 1, rotate: 0, duration: 0.5, ease: "back.out(2.4)" }, 3.96);
        tl.fromTo("#s02-free", { textShadow: "0 0 0px rgba(255,138,31,0)" }, { textShadow: "0 0 40px rgba(255,138,31,0.9)", duration: 0.3, yoyo: true, repeat: 1, immediateRender: false }, 4.2);
        // Уход сцены
        tl.to("#s02-card", { y: -60, opacity: 0, duration: 0.25, ease: "power2.in" }, 4.8);

        window.__timelines["s02"] = tl;
      </script>
    </template>
  </body>
</html>
