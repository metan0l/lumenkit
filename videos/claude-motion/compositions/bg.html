<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0b0908;
        }
        #bg-glow {
          position: absolute;
          left: -20%;
          top: 4%;
          width: 140%;
          height: 72%;
          background: radial-gradient(closest-side, rgba(150, 82, 34, 0.34), rgba(90, 46, 20, 0.14) 55%, rgba(11, 9, 8, 0) 100%);
        }
        #bg-glow-2 {
          position: absolute;
          left: 30%;
          top: 46%;
          width: 90%;
          height: 50%;
          background: radial-gradient(closest-side, rgba(255, 138, 31, 0.1), rgba(11, 9, 8, 0) 100%);
        }
        #bg-vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse 80% 70% at 50% 42%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
        }
      </style>

      <div id="root" data-composition-id="bg" data-width="1080" data-height="1920">
        <div id="bg-glow"></div>
        <div id="bg-glow-2"></div>
        <div id="bg-vignette"></div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        // Свечение медленно «дышит» и смещается — фон живой, но не отвлекает
        tl.fromTo("#bg-glow", { scale: 1, x: 0, opacity: 0.85 }, { scale: 1.12, x: 40, opacity: 1, duration: 6.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
        tl.fromTo("#bg-glow-2", { x: 0, y: 0 }, { x: -260, y: -120, duration: 13.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        window.__timelines["bg"] = tl;
      </script>
    </template>
  </body>
</html>
